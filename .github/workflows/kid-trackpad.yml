name: Kid trackpad

on:
  push:
    paths:
      - 'scripts/kid_trackpad.py'
      - 'tests/kid_trackpad.py'
      - 'install.sh'
      - 'LaunchDaemons/com.tylerlaprade.kanata.plist'
      - 'LaunchAgents/com.tylerlaprade.kid-trackpad.plist'
      - 'ruff.toml'
      - 'pyrightconfig.json'
      - '.config/kanata/kanata.kbd'
      - '.config/ruff/**'
      - '.config/basedpyright/**'
      - '.github/workflows/kid-trackpad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install linters
        run: python3 -m pip install ruff basedpyright
      - name: Link the shared lint policy where the project configs extend it
        run: |
          mkdir -p ../../.config
          ln -s "$PWD/.config/ruff" ../../.config/ruff
          ln -s "$PWD/.config/basedpyright" ../../.config/basedpyright
      - name: Test controller and lint Python
        run: |
          python3 -m unittest tests/kid_trackpad.py
          /usr/bin/python3 -m unittest tests/kid_trackpad.py
          python3 -m ruff check scripts/kid_trackpad.py tests/kid_trackpad.py
          python3 -m ruff format --check scripts/kid_trackpad.py tests/kid_trackpad.py
          basedpyright scripts/kid_trackpad.py tests/kid_trackpad.py
          bash -n install.sh
          plutil -lint LaunchDaemons/com.tylerlaprade.kanata.plist LaunchAgents/com.tylerlaprade.kid-trackpad.plist
